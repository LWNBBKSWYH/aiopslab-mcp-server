[tool.poetry]
name = "aiopslab-mcp-server"
version = "0.1.0"
description = "AIOpsLab MCP Server - Exposes AIOpsLab tools via MCP protocol"
authors = ["AI Assistant"]
readme = "README.md"
packages = [{include = "mcp_server"}]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = "^0.2.0"
httpx = "^0.27.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"